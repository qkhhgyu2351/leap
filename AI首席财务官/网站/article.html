<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阅读 · AI 首席财务官</title>
<meta name="description" content="AI 首席财务官 · 用 CFO 与资本的眼睛看清公司、产业与企业关键问题。">
<link rel="icon" type="image/png" href="assets/brand/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f7f7f4;--navy:#112c4f;--blue:#3a6e99;--green:#2f7f69;--ink:#182631;--muted:#687784;--line:#ced8df;--ease:cubic-bezier(.23,1,.32,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:15px/1.82 "Noto Sans SC","PingFang SC",sans-serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .topbar{position:sticky;top:0;z-index:20;height:74px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 clamp(22px,5vw,74px);background:rgba(247,247,244,.93);border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}
  .brand{display:flex;align-items:center;gap:12px}.brand img{width:44px;height:44px;object-fit:contain}.brand strong{font:600 17px/1 "Noto Serif SC",serif;color:var(--navy);letter-spacing:.01em}
  .back{display:inline-flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--navy);color:var(--navy);font-size:12px;transition:.18s var(--ease)}.back:hover{color:var(--green);border-color:var(--green)}
  .article{max-width:760px;margin:0 auto;padding:clamp(40px,6vw,72px) 22px 96px}
  .cat{display:inline-block;margin-bottom:16px;color:var(--green);font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase}
  h1{margin:0 0 16px;color:var(--navy);font:600 clamp(28px,4vw,38px)/1.35 "Noto Serif SC","Songti SC",serif;letter-spacing:-.02em}
  .meta{color:var(--muted);font:500 12px/1.6 "IBM Plex Mono",monospace;letter-spacing:.03em;margin-bottom:28px;padding-bottom:22px;border-bottom:1px solid var(--line)}
  .body p{margin-bottom:22px;font-size:16px;color:#2c3642}
  .note{margin-top:34px;padding:16px 18px;background:#e4efeb;border-left:3px solid var(--green);color:#3d5f59;font-size:13px;line-height:1.75}
  .foot{margin-top:40px;padding-top:22px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
  .foot a{color:var(--green);border-bottom:1px solid var(--green)}
  @media(max-width:560px){.topbar{height:64px;padding:0 18px}.brand strong{font-size:15px}.article{padding:32px 18px 64px}h1{font-size:26px}}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html"><img src="assets/brand/aicfo-symbol.png" alt="AI 首席财务官"><strong>AI 首席财务官</strong></a>
  <a class="back" href="index.html">← 返回首页</a>
</header>

<main class="article">
  <div id="content"><p style="color:#687784">加载中…</p></div>
  <div class="foot">AI 首席财务官 · 用 CFO 与资本的眼睛看公司 · <a href="index.html">返回首页</a></div>
</main>

<script src="posts.js"></script>
<script>
  (function () {
    var box = document.getElementById('content');
    function esc(s) { return (s || '').replace(/[&<>]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
    }); }

    var id = new URLSearchParams(location.search).get('id');
    var post = (window.POSTS || []).filter(function (p) { return p.id === id; })[0];

    if (post && post.url) { window.location.href = post.url; return; }

    if (!post) {
      box.innerHTML = '<p style="color:#687784">没有找到这篇文章。<a href="index.html" style="color:#2f7f69">返回首页</a></p>';
      document.title = '未找到 · AI 首席财务官';
      return;
    }

    document.title = post.title + ' · AI 首席财务官';

    var paras = (post.body || post.summary || '').split('\n')
      .map(function (t) { return t.trim(); })
      .filter(function (t) { return t.length; })
      .map(function (t) { return '<p>' + esc(t) + '</p>' }).join('');

    var meta = [post.cat || '洞察', post.date || '', post.author || '何斌', post.readTime ? '约 ' + post.readTime : '']
      .filter(Boolean).join(' · ');

    var note = (post.body === post.summary)
      ? '<div class="note">本文目前为摘要占位。正文待补充——在 posts.js 里把这篇文章的 body 换成完整文章即可。</div>'
      : '';

    box.innerHTML =
      '<span class="cat">' + esc(post.cat || '洞察') + '</span>' +
      '<h1>' + esc(post.title) + '</h1>' +
      '<div class="meta">' + esc(meta) + '</div>' +
      '<div class="body">' + paras + '</div>' +
      note;
  })();
</script>
</body>
</html>
