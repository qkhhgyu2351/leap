<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阅读 · AI 首席财务官</title>
<meta name="description" content="AI 首席财务官 · 用资本视角看公司">
<style>
  :root{
    --brand:#1B3A6B; --brand2:#185FA5; --ink:#1f2733; --muted:#6b7785;
    --line:#e6eaf0; --bg:#f5f7fa; --card:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);background:var(--bg);line-height:1.8;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}

  .topbar{background:var(--brand);color:#fff;position:sticky;top:0;z-index:10}
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:56px;
    max-width:760px;margin:0 auto;padding:0 20px}
  .logo{font-size:16px;font-weight:700}
  .back{font-size:14px;opacity:.9;border:1px solid rgba(255,255,255,.4);
    padding:6px 14px;border-radius:8px}
  .back:active{transform:translateY(1px)}

  .article{max-width:760px;margin:0 auto;padding:40px 20px 64px}
  .cat{display:inline-block;background:#eef3fb;color:var(--brand2);font-size:12px;font-weight:600;
    padding:4px 12px;border-radius:20px}
  h1{font-size:28px;line-height:1.4;margin:16px 0 12px}
  .meta{color:var(--muted);font-size:13px;margin-bottom:28px;
    border-bottom:1px solid var(--line);padding-bottom:18px}
  .body p{margin-bottom:20px;font-size:16px;color:#2c3642}
  .body p:first-child::first-letter{}
  .note{margin-top:32px;background:#fff8e6;border:1px solid #f3e2b3;color:#7a5b12;
    font-size:13px;padding:12px 16px;border-radius:10px;line-height:1.7}

  .foot{background:var(--brand);color:#dfe7f3;text-align:center;padding:32px 20px}
  .foot .big{font-size:18px;color:#fff;font-weight:600}
  .foot .back-foot{display:inline-block;margin:14px 0 0;background:rgba(255,255,255,.14);
    color:#fff;padding:8px 18px;border-radius:8px;font-size:14px;font-weight:600}
  .foot .back-foot:active{transform:translateY(1px)}
  .foot .fine{font-size:12px;opacity:.7;margin-top:14px}

  @media(max-width:760px){ h1{font-size:23px} }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="logo">AI 首席财务官</div>
    <a class="back" href="index.html">← 返回首页</a>
  </div>
</header>

<main class="article" id="article">
  <div id="content"><p style="color:#6b7785">加载中…</p></div>
</main>

<footer class="foot">
  <div class="big">主理人：何斌</div>
  <a class="back-foot" href="index.html">← 返回首页</a>
  <div class="fine">AI 首席财务官 · 用资本视角看公司 · © 2026</div>
</footer>

<script src="posts.js"></script>
<script>
  (function(){
    var box = document.getElementById('content');
    function esc(s){ return (s||'').replace(/[&<>]/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

    var id = new URLSearchParams(location.search).get('id');
    var post = (window.POSTS||[]).filter(function(p){ return p.id === id; })[0];

    if(!post){
      box.innerHTML = '<p style="color:#6b7785">没有找到这篇文章。<a href="index.html" style="color:#185FA5">返回首页</a></p>';
      document.title = '未找到 · AI 首席财务官';
      return;
    }

    document.title = post.title + ' · AI 首席财务官';

    var paras = (post.body || post.summary || '').split('\n')
      .map(function(t){ return t.trim(); })
      .filter(function(t){ return t.length; })
      .map(function(t){ return '<p>' + esc(t) + '</p>' }).join('');

    var meta = [post.cat||'洞察', post.date||'', (post.author||'何斌'), (post.readTime||'')]
      .filter(Boolean).join(' · ');

    var note = (post.body === post.summary)
      ? '<div class="note">本文目前为摘要占位。正文待补充——在 posts.js 里把这篇文章的 body 换成完整文章即可。</div>'
      : '';

    box.innerHTML =
      '<span class="cat">' + esc(post.cat||'洞察') + '</span>' +
      '<h1>' + esc(post.title) + '</h1>' +
      '<div class="meta">' + esc(meta) + '</div>' +
      '<div class="body">' + paras + '</div>' +
      note;
  })();
</script>
</body>
</html>
