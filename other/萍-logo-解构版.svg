<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="680" height="560" text-rendering="geometricPrecision" role="img">
  <title>萍 · 解构版（氵化水、艹化叶）</title>
  <desc>萍字解构升级：去框，氵化为流动水纹曲线，艹化为漂浮浮萍叶，萍字用楷体取笔意，水面波纹承托。</desc>
  <defs>
    <style>.k{font-family:"Kaiti SC","STKaiti","KaiTi","Noto Serif SC",serif}.c{font-family:"Helvetica Neue",Arial,sans-serif}</style>
  </defs>

  <rect width="680" height="560" fill="#faf6ee"/>

  <g>
    <text x="340" y="220" class="k" font-size="240" fill="#4a4038" text-anchor="middle" dominant-baseline="middle">萍</text>

    <g fill="none" stroke="#b8860b" stroke-linecap="round">
      <path d="M 218,118 C 206,152 228,184 210,216 C 198,242 218,270 204,296 C 195,314 211,332 200,350" stroke-width="3.6" opacity="0.6"/>
      <path d="M 232,128 C 222,160 242,192 226,222 C 215,246 233,272 220,300 C 212,316 226,330 218,346" stroke-width="2" opacity="0.32"/>
      <path d="M 168,372 Q 232,358 296,372 T 424,372 T 516,372" stroke-width="2.4" opacity="0.42"/>
      <path d="M 196,392 Q 256,382 316,392 T 436,392 T 512,392" stroke-width="1.5" opacity="0.26"/>
    </g>

    <g fill="#b8860b">
      <path d="M0,-26 C10,-22 10,-7 0,0 C-10,-7 -10,-22 0,-26 Z" transform="translate(296,116) rotate(-20)" opacity="0.92"/>
      <path d="M0,-30 C11,-25 11,-8 0,0 C-11,-8 -11,-25 0,-30 Z" transform="translate(340,96) rotate(6)" opacity="0.95"/>
      <path d="M0,-22 C9,-18 9,-5 0,0 C-9,-5 -9,-18 0,-22 Z" transform="translate(382,114) rotate(30)" opacity="0.9"/>
      <path d="M0,-8 C3,-7 3,-2 0,0 C-3,-2 -3,-7 0,-8 Z" transform="translate(312,142) rotate(-10)" opacity="0.8"/>
      <path d="M0,-7 C3,-6 3,-2 0,0 C-3,-2 -3,-6 0,-7 Z" transform="translate(368,140) rotate(14)" opacity="0.8"/>
    </g>
  </g>

  <g>
    <text x="340" y="452" class="k" font-size="44" fill="#2c2620" letter-spacing="9" text-anchor="middle">你好丽萍</text>
    <line x1="250" y1="472" x2="430" y2="472" stroke="#b8860b" stroke-width="0.5" opacity="0.45"/>
    <text x="340" y="496" class="c" font-size="12" fill="#b8860b" letter-spacing="9" text-anchor="middle">P · I · N · G</text>
    <text x="340" y="522" class="k" font-size="14" font-style="italic" fill="#9a8d7c" text-anchor="middle">a quiet corner for missing</text>
