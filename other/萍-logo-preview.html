<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>萍 · Logo 方案预览</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#faf6ee;font-family:"Songti SC","STSong",serif;color:#2c2620;padding:56px 24px 80px}
.wrap{max-width:680px;margin:0 auto}
.cap{font-size:13px;color:#9a8d7c;letter-spacing:3px;text-align:center;margin-bottom:24px}
.stage{background:#fffdf7;border:1px solid #ece3d2;border-radius:4px;padding:40px;box-shadow:0 2px 18px rgba(60,40,10,.05);display:flex;justify-content:center}
.stage svg{display:block;width:100%;height:auto;max-width:600px}
.row{margin-top:48px;display:flex;gap:32px;flex-wrap:wrap;justify-content:center}
.chip{background:#fffdf7;border:1px solid #ece3d2;border-radius:4px;padding:24px;text-align:center}
.chip svg{width:150px;height:auto}
.lab{font-size:12px;color:#9a8d7c;letter-spacing:2px;margin-top:10px}
.note{margin-top:48px;font-size:14px;line-height:1.8;color:#5a5145}
.note b{color:#2c2620}
</style>
</head>
<body>
<div class="wrap">

  <div class="cap">主标志 · 你好丽萍</div>
  <div class="stage">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" text-rendering="geometricPrecision">
      <defs>
        <clipPath id="seal"><circle cx="172" cy="210" r="130"/></clipPath>
        <style>.s{font-family:"Songti SC","STSong",serif}.c{font-family:"Helvetica Neue",Arial,sans-serif}</style>
      </defs>
      <rect width="680" height="420" fill="#faf6ee"/>
      <g>
        <circle cx="172" cy="210" r="132" fill="#fffdf7"/>
        <g clip-path="url(#seal)" fill="none" stroke="#b8860b" stroke-linecap="round">
          <circle cx="172" cy="252" r="70" stroke-width="1.1" opacity="0.5"/>
          <circle cx="172" cy="252" r="92" stroke-width="0.9" opacity="0.3"/>
          <circle cx="172" cy="252" r="114" stroke-width="0.7" opacity="0.16"/>
        </g>
        <circle cx="172" cy="210" r="132" fill="none" stroke="#b8860b" stroke-width="1.6"/>
        <circle cx="172" cy="210" r="125" fill="none" stroke="#b8860b" stroke-width="0.5" opacity="0.55"/>
        <g fill="#b8860b" opacity="0.9">
          <path d="M0,-22 C8.5,-18 8.5,-6 0,0 C-8.5,-6 -8.5,-18 0,-22 Z" transform="translate(146,110) rotate(-22)"/>
          <path d="M0,-19 C7,-16 7,-5 0,0 C-7,-5 -7,-16 0,-19 Z" transform="translate(198,108) rotate(24)"/>
        </g>
        <text x="172" y="216" class="s" font-size="138" fill="#2c2620" text-anchor="middle" dominant-baseline="middle">萍</text>
      </g>
      <g transform="translate(350,168)">
        <text x="0" y="0" class="s" font-size="52" fill="#2c2620" letter-spacing="8">你好丽萍</text>
        <line x1="2" y1="24" x2="300" y2="24" stroke="#b8860b" stroke-width="0.5" opacity="0.45"/>
        <text x="3" y="46" class="c" font-size="12" fill="#b8860b" letter-spacing="8">P · I · N · G</text>
        <text x="2" y="74" class="s" font-size="14" font-style="italic" fill="#9a8d7c">a quiet corner for missing</text>
      </g>
    </svg>
  </div>

  <div class="row">
    <div class="chip">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" text-rendering="geometricPrecision">
        <defs><clipPath id="s2"><circle cx="160" cy="160" r="120"/></clipPath></defs>
        <rect width="320" height="320" fill="#fffdf7"/>
        <circle cx="160" cy="160" r="120" fill="none" stroke="#b8860b" stroke-width="1.6"/>
        <circle cx="160" cy="160" r="113" fill="none" stroke="#b8860b" stroke-width="0.5" opacity="0.55"/>
        <g clip-path="url(#s2)" fill="none" stroke="#b8860b" stroke-linecap="round">
          <circle cx="160" cy="198" r="64" stroke-width="1.1" opacity="0.5"/>
          <circle cx="160" cy="198" r="86" stroke-width="0.9" opacity="0.3"/>
        </g>
        <g fill="#b8860b" opacity="0.9">
          <path d="M0,-20 C8,-16 8,-5 0,0 C-8,-5 -8,-16 0,-20 Z" transform="translate(136,78) rotate(-22)"/>
          <path d="M0,-17 C6,-14 6,-4 0,0 C-6,-4 -6,-14 0,-17 Z" transform="translate(184,76) rotate(24)"/>
        </g>
        <text x="160" y="166" font-family="Songti SC,serif" font-size="128" fill="#2c2620" text-anchor="middle" dominant-baseline="middle">萍</text>
      </svg>
      <div class="lab">印章 · 标志</div>
    </div>
    <div class="chip">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" text-rendering="geometricPrecision">
        <rect width="320" height="320" fill="#fffdf7"/>
        <g fill="none" stroke="#b8860b" stroke-linecap="round" opacity="0.7">
          <circle cx="160" cy="170" r="64" stroke-width="1.1" opacity="0.5"/>
          <circle cx="160" cy="170" r="90" stroke-width="0.9" opacity="0.3"/>
          <circle cx="160" cy="170" r="118" stroke-width="0.7" opacity="0.16"/>
        </g>
        <g fill="#b8860b" opacity="0.9">
          <path d="M0,-20 C8,-16 8,-5 0,0 C-8,-5 -8,-16 0,-20 Z" transform="translate(136,96) rotate(-22)"/>
          <path d="M0,-17 C6,-14 6,-4 0,0 C-6,-4 -6,-14 0,-17 Z" transform="translate(184,94) rotate(24)"/>
        </g>
        <text x="160" y="178" font-family="Songti SC,serif" font-size="128" fill="#2c2620" text-anchor="middle" dominant-baseline="middle">萍</text>
        <text x="160" y="286" font-family="Songti SC,serif" font-size="16" fill="#9a8d7c" text-anchor="middle" letter-spacing="4">a quiet corner for missing</text>
      </svg>
      <div class="lab">无框 · 涟漪版</div>
    </div>
  </div>

  <div class="note">
    <b>字形解构</b>　萍 = 艹 + 氵 + 平。艹 → 两片浮萍叶；氵 → 三圈涟漪水纹（思念如水面荡开）；平 → 字身保留，做辨识锚点。<br><br>
    <b>场景融合</b>　印章圆 = 静谧一角；水面涟漪 = 想一个人时心里荡开的那圈波。浮萍漂泊又相遇，正扣"萍水相逢"与"留在这里"。<br><br>
    <b>品牌叙事</b>　你好丽萍 · PING — a quiet corner for missing。配色取站点金 #b8860b 与暖墨 #2c2620，浅底，衬线体，呼应站点"喃喃细语"气质。
  </div>

</div>
</body>
</html>
